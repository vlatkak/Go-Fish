<h1>{{whoseTurnText}}</h1>
<h2>PLAYER CARDS</h2>
<p>Player's set count: {{player.completeSetNum}}</p>
<div class="hand_container" [ngStyle]="{'width': cardContainerWidthStr}">
  <button class="card_button"
    (click)="askOpponentForCard(c.rank)"
    *ngFor="let c of player.cardHand"
    [disabled]="!playerCardButtonClickable"
    [ngStyle]="{'margin-right': setCardButtonMargins('P'), 'width': cardWidthStr, 'background-image': setCardButtonSprite(c)}">
      {{c.rank}} of {{c.suit}}</button>
</div>
<p>{{infoText}}</p>
<h2>OPPONENT CARDS</h2>
<p>Opponent's set count: {{opponent.completeSetNum}}</p>
<div class="hand_container" [ngStyle]="{'width': cardContainerWidthStr}">
  <div class="opponent_cards"
     *ngFor="let c of opponent.cardHand"
     [ngStyle]="{'margin-right': setCardButtonMargins('O'), 'width': cardWidthStr}">
        {{c.rank}} of {{c.suit}}</div>
</div>
